langcode: en
status: true
dependencies:
  config:
    - field.storage.node.body
    - field.storage.node.field_dataset
    - field.storage.node.field_document
    - field.storage.node.field_quanthub_urn
    - field.storage.node.field_timestamp
    - field.storage.node.field_topics
    - search_api.server.elasticsearch
  module:
    - media
    - node
    - publication_date
    - taxonomy
id: content
name: Content
description: ''
read_only: false
field_settings:
  body:
    label: Body
    datasource_id: 'entity:node'
    property_path: body
    type: text
    dependencies:
      config:
        - field.storage.node.body
  field_dataset:
    label: Dataset
    datasource_id: 'entity:node'
    property_path: field_dataset
    type: integer
    dependencies:
      config:
        - field.storage.node.field_dataset
  field_document_name:
    label: 'Document » Name'
    datasource_id: 'entity:node'
    property_path: 'field_document:entity:name'
    type: text
    boost: 0.5
    dependencies:
      config:
        - field.storage.node.field_document
      module:
        - media
  field_quanthub_urn:
    label: 'Quanthub URN'
    datasource_id: 'entity:node'
    property_path: field_quanthub_urn
    type: string
    dependencies:
      config:
        - field.storage.node.field_quanthub_urn
  field_timestamp:
    label: Date
    datasource_id: 'entity:node'
    property_path: field_timestamp
    type: date
    dependencies:
      config:
        - field.storage.node.field_timestamp
  field_topics:
    label: Topics
    datasource_id: 'entity:node'
    property_path: field_topics
    type: integer
    dependencies:
      config:
        - field.storage.node.field_topics
  field_topics_name:
    label: 'Topics » Name'
    datasource_id: 'entity:node'
    property_path: 'field_topics:entity:name'
    type: text
    boost: 0.5
    dependencies:
      config:
        - field.storage.node.field_topics
      module:
        - taxonomy
  nid:
    label: ID
    datasource_id: 'entity:node'
    property_path: nid
    type: integer
    dependencies:
      module:
        - node
  promote:
    label: Promoted
    datasource_id: 'entity:node'
    property_path: promote
    type: boolean
    dependencies:
      module:
        - node
  published_at:
    label: 'Published on'
    datasource_id: 'entity:node'
    property_path: published_at
    type: date
    dependencies:
      module:
        - publication_date
  sticky:
    label: Sticky
    datasource_id: 'entity:node'
    property_path: sticky
    type: boolean
    dependencies:
      module:
        - node
  summary:
    label: 'Body » Summary'
    datasource_id: 'entity:node'
    property_path: 'body:summary'
    type: text
    dependencies:
      config:
        - field.storage.node.body
  title:
    label: Title
    datasource_id: 'entity:node'
    property_path: title
    type: text
    boost: 3.0
    dependencies:
      module:
        - node
  type:
    label: 'Content type'
    datasource_id: 'entity:node'
    property_path: type
    type: string
    dependencies:
      module:
        - node
datasource_settings:
  'entity:node':
    bundles:
      default: true
      selected:
        - page
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  aggregated_field: {  }
  custom_value: {  }
  entity_status: {  }
  entity_type: {  }
  hierarchy:
    weights:
      preprocess_index: -45
    fields:
      field_dataset: node-field_dataset
      field_topics: taxonomy_term-parent
  html_filter:
    weights:
      preprocess_index: -15
      preprocess_query: -15
    all_fields: true
    fields:
      - body
      - field_document_name
      - field_quanthub_urn
      - field_topics_name
      - summary
      - title
      - type
    title: true
    alt: true
    tags:
      b: 2
      em: 1
      h1: 5
      h2: 3
      h3: 2
      strong: 2
      u: 1
  ignorecase:
    weights:
      preprocess_index: -20
      preprocess_query: -20
    all_fields: true
    fields:
      - body
      - field_document_name
      - field_quanthub_urn
      - field_topics_name
      - summary
      - title
      - type
  language_with_fallback: {  }
  rendered_item: {  }
  reverse_entity_references: {  }
  stopwords:
    weights:
      preprocess_index: -5
      preprocess_query: -2
    all_fields: true
    fields:
      - body
      - field_document_name
      - field_topics_name
      - summary
      - title
    stopwords:
      - a
      - an
      - and
      - are
      - as
      - at
      - be
      - but
      - by
      - for
      - if
      - in
      - into
      - is
      - it
      - 'no'
      - not
      - of
      - 'on'
      - or
      - s
      - such
      - t
      - that
      - the
      - their
      - then
      - there
      - these
      - they
      - this
      - to
      - was
      - will
      - with
  tokenizer:
    weights:
      preprocess_index: -6
      preprocess_query: -6
    all_fields: true
    fields:
      - body
      - field_document_name
      - field_topics_name
      - summary
      - title
    spaces: ''
    ignored: ''
    overlap_cjk: 1
    minimum_word_size: '3'
tracker_settings:
  default:
    indexing_order: fifo
options:
  cron_limit: 50
  delete_on_fail: true
  index_directly: true
  track_changes_in_references: true
server: elasticsearch
