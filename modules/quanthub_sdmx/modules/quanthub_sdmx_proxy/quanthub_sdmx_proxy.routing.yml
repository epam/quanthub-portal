sdmx_proxy.forwarder:
  path: '/sdmx'
  methods: [GET, PUT, POST, PATCH, DELETE, OPTIONS]
  defaults:
    _controller: Drupal\quanthub_sdmx_proxy\Controller\Forwarder::forward
    _title: 'SDMX API Proxy request forwarder'
  requirements:
    # JSON format is specified to show JSON response on "Accept: */*" header.
    # It should affect Drupal errors only, but shouldn't affect proxied responses
    # if e.g. "Accept: application/xml" is specified.
    _format: 'json'
    _permission: 'access content'

sdmx_proxy.forwarder-download:
  path: '/sdmx-download'
  methods: [GET, PUT, POST, PATCH, DELETE, OPTIONS]
  defaults:
    _controller: Drupal\quanthub_sdmx_proxy\Controller\Forwarder::forwardDownload
    _title: 'SDMX API Proxy request forwarder'
  requirements:
    _format: 'json'
    _permission: 'access content'
