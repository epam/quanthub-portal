powerbi_embed_config:
  path: '/powerbi/embedconfig/{reportId}'
  defaults:
    _title: 'EmbedConfig'
    _controller: '\Drupal\quanthub_core\Controller\PowerBIEmbedController::postData'
  requirements:
    _permission: 'access content'

quanthub_core.export_to_file:
  path: '/powerbi/reports/{reportId}/exportTo'
  defaults:
    _controller: '\Drupal\quanthub_core\Controller\PowerBiApiController::proxyPowerBiRequest'
  requirements:
    _permission: 'access content'

quanthub_core.get_export_status:
  path: '/powerbi/reports/{reportId}/exports/{exportId}'
  defaults:
    _controller: '\Drupal\quanthub_core\Controller\PowerBiApiController::proxyPowerBiRequest'
  requirements:
    _permission: 'access content'

quanthub_core.get_export_file:
  path: '/powerbi/reports/{reportId}/exports/{exportId}/file'
  defaults:
    _controller: '\Drupal\quanthub_core\Controller\PowerBiApiController::proxyPowerBiRequest'
  requirements:
    _permission: 'access content'
